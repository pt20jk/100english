    <script type="application/json" id="trainer-course">"# 영어회화 100일의 기적 2 · 본문 대화\n\n한국어를 문제로, 영어를 정답으로 사용한다. 표의 한 행이 한 발화다. 순서 학습은 일차와 발화 순서를 따르고, 랜덤 퀴즈와 오답노트에서도 같은 카드 ID를 사용한다.\n\n## DAY 001 · 봄꽃 나들이\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 001-01 | A | 넌 봄이 되면 뭐가 좋아? | What do you like about spring? |\n| 001-02 | B | 전국적으로 나무에 꽃이 만개하잖아. | A lot of trees burst into blossom all across the country. |\n| 001-03 | A | 내일 벚꽃 축제에 같이 가자. | Let’s check out the cherry blossom festival tomorrow. |\n| 001-04 | B | 좋아. 일찍 출발해서 교통 혼잡을 피하자. | Sure. We have to leave early to beat the traffic. |\n| 001-05 | A | 일어나자마자 바로 전화할게. | I’ll call you first thing in the morning. |\n| 001-06 | B | 도시락 많이 싸 올게. | I’ll pack a big lunch for us. |\n\n## DAY 002 · 약속 시간 잡기\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 002-01 | A | 영화가 6시에 시작해. 5시쯤 출발하자. | The movie begins at 6. Let’s leave around 5. |\n| 002-02 | B | 좋아. 그 시간에는 차가 안 막히니까. | Okay. The traffic isn’t bad at that time of day. |\n| 002-03 | A | 내가 너희 집으로 데리러 갈게. | I’ll pick you up from your place. |\n| 002-04 | B | 고맙지만 너무 무리는 하지 마. | Thanks, but don’t go out of your way. |\n| 002-05 | A | 괜찮아. 영화관 가는 길이야. | No problem. It’s on my way to the cinema. |\n| 002-06 | B | 출발할 때 전화해. | Give me a call when you’re about to leave. |\n\n## DAY 003 · 마트 가는 날\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 003-01 | A | 충동구매 그만해. 두 시간째야. | No more impulse buying! It’s been two hours. |\n| 003-02 | B | 재촉하지 마. 최선을 다하고 있어. | Don’t be so pushy. I’m doing my best. |\n| 003-03 | A | 제발 부탁이야. 쇼핑 목록에 충실하자. | Pretty please. Let’s just stick to our shopping list. |\n| 003-04 | B | 그만 좀 해. 힘들게 좀 하지 마. | Would you stop it? Don’t try my patience. |\n| 003-05 | A | 일단 흩어지자. 맥주 좀 사 올게. | Let’s split up. I’ll go get some beers. |\n| 003-06 | B | 알았어. 10분 후에 계산대에서 만나. | OK. I’ll see you at the cashier in 10 minutes. |\n\n## DAY 004 · 다이어트 결심\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 004-01 | A | 무슨 일이야? 왜 이렇게 조금만 먹어? | What’s going on? Why do you eat like a bird? |\n| 004-02 | B | 살이 찌고 있어. 탄수화물을 줄이려고 노력 중이야. | I’m getting overweight. I’m trying to cut down on carbs. |\n| 004-03 | A | 할 수 있을까? 너 탄수화물 엄청 좋아하잖아. | I doubt you can do it. You’re a big fan of carbs. |\n| 004-04 | B | 이젠 아니야. 체중 조절을 해야 해. | Not any more. I have to watch my weight. |\n| 004-05 | A | 지금도 괜찮아 보이는 것 같은데. | I think you look good the way you are. |\n| 004-06 | B | 말리지 마. 다이어트하기로 마음먹었어. | Don’t stop me. I have my heart set on doing it. |\n\n## DAY 005 · 속이 더부룩해\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 005-01 | A | 저녁 먹으러 나갈 준비됐어? | Are you ready to go out for dinner? |\n| 005-02 | B | 응. 근데 속이 좀 더부룩해. | Yes, but I’m feeling a bit bloated. |\n| 005-03 | A | 정말? 점심 때 뭐 먹었는데? | Really? What have you had for lunch? |\n| 005-04 | B | 오후에 떡볶이를 좀 먹은 것 같아. | I think I ate some tteokbokki in the afternoon. |\n| 005-05 | A | 속 편하게 해 줄 것 좀 사다 줄까? | Can I get you something to ease your stomach? |\n| 005-06 | B | 아니, 괜찮아. 죽 배달시킬 거야. | No, thanks. I’ll have some porridge delivered. |\n\n## DAY 006 · 외모가 경쟁력\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 006-01 | A | 웬일이야. 파마한 것 같은데. | Look at you! It looks like you got a perm. |\n| 006-02 | B | 맞아. 알아보겠어? 어때 보여? | Yes. Can you tell? How do I look? |\n| 006-03 | A | 보기 좋은데. 나이보다 어려 보여. | It looks great. You look younger than your age. |\n| 006-04 | B | 정말? 그게 내가 늘 바라던 거야. | Really? That’s what I’ve always wanted. |\n| 006-05 | A | 외모 관리에 너무 신경 쓰는데. | You’re really into taking care of your looks. |\n| 006-06 | B | 저녁에 데이트가 있어. 좋은 인상을 남겨야지. | I have a date tonight. I want to leave a good impression. |\n\n## DAY 007 · 버스 노선 묻기\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 007-01 | A | 고속버스 터미널까지 어떻게 가나요? | How can I get to the Express Bus Terminal? |\n| 007-02 | B | 건너편에서 3번 버스를 타시면 됩니다. | You can take the bus No. 3 across the street. |\n| 007-03 | A | 도로를 건너야 한다는 뜻이죠? | You mean I have to cross the road? |\n| 007-04 | B | 네. 제가 알기로는 20분마다 운행해요. | Right. From what I know, it runs every 20 minutes. |\n| 007-05 | A | 고마워요. 저기 버스가 오네요. | Thank you. There comes the bus. |\n| 007-06 | B | 신호등이 파란불이네요. 뛰세요! | The traffic light is green. Run! |\n\n## DAY 008 · 셀카봉이 필요해\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 008-01 | A | 전망 진짜 좋다. 너무 좋아. | What a nice view! It’s too good to be true. |\n| 008-02 | B | 사진 찍자. 셀카봉 가져왔어? | Let’s take a picture. Did you bring your selfie-stick? |\n| 008-03 | A | 이런! 호텔 방에 두고 왔나 봐. | Oh, no! I think I left it in my hotel room. |\n| 008-04 | B | 다른 사람한테 찍어 달라고 하자. | Let’s ask someone else to take one. |\n| 008-05 | A | 실례지만 사진 한 장 찍어 주시겠어요? | Excuse me. Would you take a picture for us? |\n| 008-06 | B | 배경에 분수가 나오게 찍어 주세요. | Try to get the fountain in the background. |\n\n## DAY 009 · 수제 돈가스\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 009-01 | A | 여기가 동네에서 최고인 것 같아. | I think this place is the best in town. |\n| 009-02 | B | 메뉴 중에 가장 인기 있는 건 뭐야? | What’s the most popular item on the menu? |\n| 009-03 | A | 수제 돈가스가 꽤 유명해. | It’s well-known for handmade pork cutlet. |\n| 009-04 | B | 빨리 먹고 싶다. 배에서 꼬르륵거려. | I can’t wait to eat it. My stomach is growling. |\n| 009-05 | A | 음식 나온다. 맛이 어때? | It’s coming. How do you like it? |\n| 009-06 | B | 와! 진짜 맛있는데. | Wow! This is out of this world. |\n\n## DAY 010 · 김칫국 마시지 마\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 010-01 | A | 오늘 멋지다. 오늘 무슨 날이야? | You look sharp today. What’s the occasion? |\n| 010-02 | B | 오늘 저녁에 친구가 소개팅을 주선해 줬어. | My friend set me up on a blind date tonight. |\n| 010-03 | A | 잘됐네! 잘되면 좋겠다. | Good for you! I hope it works out. |\n| 010-04 | B | 이번엔 왠지 느낌이 좋아. | For some reason, I have good vibes this time. |\n| 010-05 | A | 김칫국 좀 마시지 마. | Don’t count your chickens before they hatch. |\n| 010-06 | B | 진짜야. 내 말 믿어도 돼. | It’s for real! You can take my word for it. |\n\n## DAY 011 · 지하철 환승\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 011-01 | A | 이쪽이 수서역 가는 길이 맞나요? | Is this the right way to Suseo station? |\n| 011-02 | B | 아니요. 반대편으로 가셔야 합니다. | No. You have to go to the other side. |\n| 011-03 | A | 고맙습니다. 열차를 갈아타야 하나요? | Thank you. Do I need to change trains? |\n| 011-04 | B | 네. 교대역에서 3호선으로 갈아타세요. | Yes. You can transfer to line number 3 at Gyodae. |\n| 011-05 | A | 정말 친절하시네요. 너무 감사합니다. | That’s so nice of you. Thanks a million. |\n| 011-06 | B | 천만에요. 도움이 돼서 기뻐요. | Not at all. It’s my pleasure to help you. |\n\n## DAY 012 · 생일 파티 계획\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 012-01 | A | 금요일에 조이의 생일 파티를 할 거야. 올 수 있어? | I’m throwing a birthday party for Joy on Friday. Can you come? |\n| 012-02 | B | 농담해? 무슨 일이 있어도 참석해야지. | Are you kidding? I wouldn’t miss it for the world. |\n| 012-03 | A | 대학교 동창들 몇 명 초대할 거야. | I’ll invite some of my friends from university. |\n| 012-04 | B | 네가 괜찮다면 몇 명 연락해 볼게. | I can make contact with some guys if you’re okay. |\n| 012-05 | A | 고맙지만 조촐하게 하려고. | Thanks, but we’ll be having a small party. |\n| 012-06 | B | 그럼 더 좋지. 재미있겠다. | That sounds even better. It sounds like fun. |\n\n## DAY 013 · 오늘 휴가 냈어\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 013-01 | A | 여보, 일어나! 오늘 일 안 해? | Honey, wake up! Don’t you have work today? |\n| 013-02 | B | 내가 말 안 했나? 쉬는 날이야. | Didn’t I tell you? I have the day off. |\n| 013-03 | A | 아니. 그런 말 한 적 없는데. | No. You didn’t tell me that. |\n| 013-04 | B | 요즘 자주 깜빡하네. 나들이 좀 갈까? | I’ve been forgetful lately. Shall we go on a picnic? |\n| 013-05 | A | 좋지. 우리 데이트한 지 얼마 만이야? | Great! How long has it been since we had a date? |\n| 013-06 | B | 미안. 보고서 쓰느라 좀 바빴어. | Sorry. I’ve been busy writing some reports. |\n\n## DAY 014 · 온라인 게임\n\n| 카드 ID | 화자 | 한국어 | 영어 |\n|---|---|---|---|\n| 014-01 | A | 무슨 게임을 하는 거야? 재미있어 보인다. | What are you playing? It looks fun. |\n| 014-02 | B | 와이파이가 안 될 때도 할 수 있어. | You can play even when Wi-Fi is not available. |\n| 014-03 | A | 좋은데! 철자 좀 알려 줄래? | Good! Can you spell that for me? |\n| 014-04 | B | 앱스토어에서 ‘MARVEL’이라고 쳐 봐. | MARVEL. Put it in on the App Store. |\n| 014-05 | A | 끝내준다. 내가 바로 원했던 거야. |
